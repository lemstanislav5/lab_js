<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учёт поступления товаров</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
            font-family: "Times New Roman", Times, serif;
            font-size: 28px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 5px 8px;
            text-align: left;
        }
        th {
            font-weight: bold;
        }
        td:nth-child(2), td:nth-child(3), td:nth-child(4) {
            text-align: right;
        }
        td:first-child, th:first-child {
            text-align: left;
        }
        tr.total-row td {
            font-weight: bold;
        }
        .form-container {
            max-width: 400px;
            margin: 0 auto;
        }
        .form-container h2 {
            font-size: 18px;
            font-weight: normal;
            font-family: "Times New Roman", Times, serif;
            text-align: center;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .form-group label {
            width: 120px;
        }
        .form-group select, .form-group input {
            width: 200px;
            box-sizing: border-box;
        }
        .submit-btn {
            margin-left: 120px;
            padding: 2px 10px;
        }
    </style>
</head>
<body>

    <h1>Учёт поступления товаров</h1>

    <table id="goodsTable">
        <thead>
            <tr>
                <th>Наименование товара</th>
                <th>цена за единицу</th>
                <th>количество</th>
                <th>стоимость</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
        <tfoot>
            <tr class="total-row">
                <td colspan="3">ИТОГО</td>
                <td id="totalSum">0</td>
            </tr>
        </tfoot>
    </table>

    <div class="form-container">
        <h2>Изменение цены и количества</h2>
        <form id="editForm">
            <div class="form-group">
                <label for="productSelect">Товар</label>
                <select id="productSelect"></select>
            </div>
            <div class="form-group">
                <label for="priceInput">Цена</label>
                <input type="number" id="priceInput" min="0" required>
            </div>
            <div class="form-group">
                <label for="qtyInput">Количество</label>
                <input type="number" id="qtyInput" min="0" required>
            </div>
            <button type="submit" class="submit-btn">Ввод</button>
        </form>
    </div>

    <script>
        // Исходные данные товаров
        const goods = [
            { id: 1, name: "Стол письменный", price: 12000, qty: 5 },
            { id: 2, name: "Стол кухонный", price: 8000, qty: 10 },
            { id: 3, name: "Стул", price: 20, qty: 1200 },
            { id: 4, name: "Шкаф книжный", price: 14200, qty: 4 }
        ];

        const tableBody = document.querySelector('#goodsTable tbody');
        const totalSumCell = document.getElementById('totalSum');
        const productSelect = document.getElementById('productSelect');
        const priceInput = document.getElementById('priceInput');
        const qtyInput = document.getElementById('qtyInput');
        const editForm = document.getElementById('editForm');

        // Функция для отрисовки таблицы и выпадающего списка
        function renderTable() {
            tableBody.innerHTML = '';
            productSelect.innerHTML = '';
            let total = 0;

            goods.forEach((item, index) => {
                // Расчет стоимости
                const cost = item.price * item.qty;
                total += cost;

                // Создание строки таблицы
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.price}</td>
                    <td>${item.qty}</td>
                    <td>${cost}</td>
                `;
                tableBody.appendChild(tr);

                // Заполнение выпадающего списка
                const option = document.createElement('option');
                option.value = index; // Используем индекс массива как значение
                option.textContent = item.name;
                productSelect.appendChild(option);
            });

            // Обновление итоговой суммы
            totalSumCell.textContent = total;
        }

        // Функция для заполнения полей ввода при выборе товара
        function updateFormFields() {
            const selectedIndex = productSelect.value;
            if (selectedIndex !== "") {
                priceInput.value = goods[selectedIndex].price;
                qtyInput.value = goods[selectedIndex].qty;
            }
        }

        // Обработчик отправки формы
        editForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Предотвращаем перезагрузку страницы

            const selectedIndex = productSelect.value;
            const newPrice = parseFloat(priceInput.value);
            const newQty = parseInt(qtyInput.value, 10);

            // Валидация
            if (selectedIndex === "" || isNaN(newPrice) || isNaN(newQty) || newPrice < 0 || newQty < 0) {
                alert("Пожалуйста, введите корректные данные.");
                return;
            }

            // Обновление данных
            goods[selectedIndex].price = newPrice;
            goods[selectedIndex].qty = newQty;

            // Перерисовка таблицы с новыми данными
            renderTable();
            
            // Возвращаем фокус на выбор товара (опционально)
            productSelect.focus();
        });

        // При смене товара в списке - подставляем его текущие значения
        productSelect.addEventListener('change', updateFormFields);

        // Первоначальная инициализация
        renderTable();
        updateFormFields(); // Заполняем поля для первого товара по умолчанию

    </script>
</body>
</html>
