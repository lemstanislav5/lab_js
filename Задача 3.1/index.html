<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Заказ мебели</title>
    <style>
        body { font-family: sans-serif; }
        .form-group { margin-bottom: 15px; }
        label { display: inline-block; width: 150px; }
    </style>
</head>
<body>
    <h1>Заказ мебели</h1>
    
    <!-- Форма отправляет данные методом POST на файл order.php -->
    <form action="order.php" method="post">
        
        <div class="form-group">
            <label>Изделие:</label>
            <select name="product">
                <option value="Шкаф">Шкаф</option>
                <option value="Стол">Стол</option>
                <option value="Сервант">Сервант</option>
            </select>
        </div>

        <div class="form-group">
            <label>Материал:</label>
            <select name="material">
                <option value="Дуб">Дуб</option>
                <option value="Орех">Орех</option>
                <option value="Бук">Бук</option>
            </select>
        </div>

        <div class="form-group">
            <label>Количество:</label>
            <!-- type="number" поможет браузеру, но проверку все равно делаем в PHP -->
            <input type="number" name="quantity" min="1">
        </div>

        <button type="submit">Отправить заказ</button>
    </form>
</body>
</html>
