<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изменение цвета при щелчке</title>
    <style>
        /* Базовые стили для текста */
        h2, p, div {
            color: black;
            background-color: #5c5ced;
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <h2 id="header">ДОСТУП К СВОЙСТВАМ И МЕТОДАМ</h2>
    <p>Коллекция all</p>
    <div id="block">Метод getElementById()</div>

    <script>
        // Получаем элементы по их тегам
        const header = document.getElementById('header');
        console.log(header);
        const paragraph = Array.from(document.all).find(el => el.tagName === 'P');
        console.log(paragraph);
        const block = document.getElementById('block');
        console.log(block);

        // 1. Клик по первой строке (изменение цвета букв с чёрного на белый и наоборот)
        header.addEventListener('click', function() {
            if (this.style.color === 'white') {
                this.style.color = 'black';
                this.style.backgroundColor = '#5c5ced';
            } else {
                this.style.color = 'white';
                this.style.backgroundColor = '#ebdd68';
            }
        });


        // 2. Клик по второй строке (пример: изменение фона)
        paragraph.addEventListener('click', function() {
            if (this.style.color === 'white') {
                this.style.color = 'black';
                this.style.backgroundColor = '#5c5ced';
            } else {
                this.style.color = 'white';
                this.style.backgroundColor = '#ebdd68';
            }
        });
        
        // 3. Клик по третьей строке (пример: изменение и фона, и букв)
        // Поскольку внутри стрелочных функций ключевое слово this теряет контекст элемента, его нужно заменить на e.currentTarget

        block.addEventListener('click', (e) => {
            console.log(e.currentTarget.style.backgroundColor)
            if (e.currentTarget.style.backgroundColor === 'rgb(92, 92, 237)') {
                e.currentTarget.style.backgroundColor = '#ebdd68';
                e.currentTarget.style.color = 'white';
            } else {
                e.currentTarget.style.backgroundColor = '#5c5ced';
                e.currentTarget.style.color = 'black';
            }
        });
    </script>

</body>
</html>
