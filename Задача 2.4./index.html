<script>
    function Proverka() {
        im = document.f1.name.value;
        vozr = document.forms[0].elements[1].value;
        st = "";
        if (im == "")
            st = "имя\n";
        if (vozr == "")
            st += "возраст";
        if (st == "") {
            document.f1.action = "prim3_1.php";
            return true;
        } else { //отмена передачи на веб-сервер
            str = "Введите:\n" + st;
            alert(str);
            return false;
        }
    }
</script>
